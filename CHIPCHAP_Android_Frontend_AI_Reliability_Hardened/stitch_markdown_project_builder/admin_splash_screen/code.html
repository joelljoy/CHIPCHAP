<style>
        .splash-bg {
            background: linear-gradient(135deg, #003d9b 0%, #001848 100%);
        }
        
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-in {
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .shield-pulse {
            animation: pulseShield 3s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulseShield {
            0% { filter: drop-shadow(0 0 10px rgba(196, 210, 255, 0.2)); }
            100% { filter: drop-shadow(0 0 25px rgba(196, 210, 255, 0.6)); }
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex items-center justify-center splash-bg">
<div class="flex flex-col items-center justify-center px-container-margin w-full max-w-md">
<!-- Logo / Icon -->
<div class="mb-lg fade-in-up shield-pulse">
<div class="w-32 h-32 bg-on-primary rounded-3xl flex items-center justify-center shadow-lg transform rotate-3">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    shield_person
                </span>
</div>
</div>
<!-- Brand Text -->
<div class="text-center mb-xl fade-in-up" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg text-headline-lg text-on-primary mb-sm tracking-tight">
                CHIPCHAP
            </h1>
<p class="font-label-md text-label-md text-primary-fixed tracking-widest uppercase">
                Government Portal
            </p>
</div>
<!-- Loading Indicator -->
<div class="w-full max-w-[200px] mt-xl fade-in">
<div class="h-1 w-full bg-primary-fixed-dim/30 rounded-full overflow-hidden">
<div class="h-full bg-on-primary rounded-full w-1/3 animate-[slideRight_2s_ease-in-out_infinite]" style="animation: slideRight 1.5s infinite ease-in-out;"></div>
</div>
<p class="text-center mt-sm font-label-sm text-label-sm text-primary-fixed/80">
                Authenticating Credentials...
            </p>
</div>
</div>
<style>
        @keyframes slideRight {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(300%); }
        }
    </style>
<script>
        // Simple script to simulate a splash screen redirect
        setTimeout(() => {
            // In a real app, this would route to the login or dashboard
            console.log("Routing to application...");
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
        }, 3000);
