<!DOCTYPE html>

<html class="h-full bg-surface" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Civic Clarity - Admin Login</title>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#edf0ff",
                      "surface-tint": "#0c56d0",
                      "surface-gray": "#F4F5F7",
                      "primary-fixed-dim": "#b2c5ff",
                      "on-primary-fixed-variant": "#0040a2",
                      "tertiary-container": "#006844",
                      "on-primary-fixed": "#001848",
                      "error": "#ba1a1a",
                      "surface": "#faf9ff",
                      "background": "#faf9ff",
                      "primary-container": "#0052cc",
                      "on-secondary": "#ffffff",
                      "on-surface-variant": "#434654",
                      "primary-fixed": "#dae2ff",
                      "tertiary-fixed-dim": "#65dca4",
                      "surface-dim": "#ccdaff",
                      "outline": "#737685",
                      "tertiary": "#004e32",
                      "inverse-primary": "#b2c5ff",
                      "secondary-fixed-dim": "#ffb77e",
                      "inverse-surface": "#1d3054",
                      "on-secondary-fixed": "#2f1500",
                      "primary": "#003d9b",
                      "surface-variant": "#d8e2ff",
                      "secondary-container": "#fe8a00",
                      "on-primary-container": "#c4d2ff",
                      "on-tertiary-fixed": "#002113",
                      "outline-variant": "#c3c6d6",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#82f9be",
                      "alert-red": "#DE350B",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#613100",
                      "secondary-fixed": "#ffdcc3",
                      "on-tertiary": "#ffffff",
                      "safety-orange-light": "#FFFAE6",
                      "surface-container-high": "#e1e8ff",
                      "on-surface": "#051a3e",
                      "surface-container-highest": "#d8e2ff",
                      "civic-blue-dark": "#0747A6",
                      "surface-container": "#e9edff",
                      "on-background": "#051a3e",
                      "surface-container-low": "#f1f3ff",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "border-subtle": "#DFE1E6",
                      "on-tertiary-fixed-variant": "#005235",
                      "on-tertiary-container": "#72e9af",
                      "on-secondary-fixed-variant": "#6e3900",
                      "secondary": "#914d00",
                      "on-error-container": "#93000a",
                      "surface-bright": "#faf9ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "12px",
                      "xl": "32px",
                      "container-margin": "20px",
                      "xs": "4px",
                      "sm": "8px",
                      "lg": "24px",
                      "base": "8px",
                      "md": "16px"
              },
              "fontFamily": {
                      "label-md": ["JetBrains Mono"],
                      "headline-md": ["Hanken Grotesk"],
                      "label-sm": ["JetBrains Mono"],
                      "body-sm": ["Hanken Grotesk"],
                      "body-lg": ["Hanken Grotesk"],
                      "headline-sm": ["Hanken Grotesk"],
                      "headline-lg": ["Hanken Grotesk"],
                      "body-md": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            }
          }
        }
      </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-primary-fixed) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-full font-body-md text-on-surface bg-surface flex flex-col items-center justify-center relative overflow-hidden">
<!-- Abstract Ambient Background -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-40 -left-40 w-96 h-96 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
<div class="absolute top-40 -right-40 w-96 h-96 bg-surface-container-high rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
<div class="absolute -bottom-40 left-20 w-72 h-72 bg-inverse-on-surface rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-4000"></div>
<div class="absolute inset-0 bg-pattern opacity-30"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-container-margin md:px-0">
<!-- Logo / Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary-container mb-md shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Civic Clarity</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Admin Control Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(9,30,66,0.12)] p-xl border border-border-subtle">
<form action="#" class="space-y-lg" method="POST">
<!-- ID/Email Input -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="admin-id">Government ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-70">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-border-subtle rounded-lg bg-surface-gray text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors h-12" id="admin-id" name="admin-id" placeholder="gov.id@civicclarity.gov" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-civic-blue-dark transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant opacity-70">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-border-subtle rounded-lg bg-surface-gray text-on-surface font-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface-container-lowest transition-colors h-12" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined opacity-70">visibility_off</span>
</button>
</div>
</div>
<!-- Security Notice -->
<div class="flex items-start bg-surface-container-low p-sm rounded-lg border border-border-subtle mt-md">
<span class="material-symbols-outlined text-on-surface-variant mr-2 mt-0.5" style="font-size: 16px;">shield_lock</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Access to this system is restricted to authorized personnel only. All activities are logged and monitored.</p>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-on-primary bg-primary hover:bg-civic-blue-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary font-headline-sm text-headline-sm transition-all active:scale-[0.98] h-12" type="submit">
                        Login as Administrator
                        <span class="material-symbols-outlined ml-2">login</span>
</button>
</div>
</form>
</div>
<!-- Footer Info -->
<div class="mt-lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">System version 2.4.1 (Stable)</p>
</div>
</main>
</body></html>
