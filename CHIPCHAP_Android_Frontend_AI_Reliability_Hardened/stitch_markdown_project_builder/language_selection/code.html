<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .lang-card {
            transition: all 0.2s ease-in-out;
        }
        .lang-card.selected {
            border-color: #003d9b;
            background-color: #e9edff;
            box-shadow: 0 4px 12px rgba(0, 61, 155, 0.1);
        }
        .lang-card.selected .radio-indicator {
            border-color: #003d9b;
            background-color: #003d9b;
        }
        .lang-card.selected .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
        }
    </style>

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased select-none">
<!-- Header (Transactional context, simplified) -->
<header class="w-full pt-12 pb-6 px-container-margin flex flex-col items-center justify-center relative z-10 bg-surface">
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">CHIPCHAP</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-margin w-full max-w-md mx-auto z-10 pb-32">
<div class="mb-8 mt-4 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Select Language</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Choose your preferred language to continue.</p>
</div>
<div class="flex flex-col space-y-4 w-full" id="language-list">
<!-- English -->
<div class="lang-card selected border border-outline-variant bg-surface rounded-xl p-4 flex items-center cursor-pointer relative overflow-hidden" data-lang="en">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 flex-shrink-0 text-primary">
<span class="font-headline-sm text-headline-sm">A</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">English</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Default</p>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative ml-2"></div>
</div>
<!-- Hindi -->
<div class="lang-card border border-outline-variant bg-surface rounded-xl p-4 flex items-center cursor-pointer relative overflow-hidden" data-lang="hi">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 flex-shrink-0 text-primary">
<span class="font-headline-sm text-headline-sm">अ</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Hindi / हिन्दी</h3>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative ml-2"></div>
</div>
<!-- Marathi -->
<div class="lang-card border border-outline-variant bg-surface rounded-xl p-4 flex items-center cursor-pointer relative overflow-hidden" data-lang="mr">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 flex-shrink-0 text-primary">
<span class="font-headline-sm text-headline-sm">म</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Marathi / मराठी</h3>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant relative ml-2"></div>
</div>
<!-- Gujarati -->
<div class="lang-card border border-outline-variant bg-surface rounded-xl p-4 flex items-center cursor-pointer relative overflow-hidden" data-lang="gu">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mr-4 flex-shrink-0 text-primary">

                Continue
                <span class="material-symbols-outlined ml-2 text-[20px]" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</a>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.lang-card');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected from all
                    cards.forEach(c => c.classList.remove('selected'));
                    // Add to clicked
                    card.classList.add('selected');
                    
                    // Subtle haptic feedback if supported
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(50);
                    }
                });
            });
        });
    </script>
