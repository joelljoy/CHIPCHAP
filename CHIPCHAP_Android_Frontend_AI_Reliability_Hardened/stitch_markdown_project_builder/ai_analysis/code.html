<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0052cc, transparent);
            box-shadow: 0 0 10px #0052cc;
            animation: scan 2.5s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .pulsing-box {
            animation: pulse-border 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(0, 82, 204, 1); box-shadow: 0 0 0 0 rgba(0, 82, 204, 0.4); }
            50% { border-color: rgba(0, 82, 204, 0.5); box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1); }
        }
    </style>
</head>
<body class="bg-surface h-full font-sans antialiased text-on-surface flex flex-col pt-14">
<!-- TopAppBar (Transactional - Hidden Navigation Shell rule applied, using generic back header) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background flex items-center justify-between px-container-margin h-14 flat no shadows">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full p-2 transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-civic-blue-dark dark:text-primary-fixed">CHIPCHAP</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full p-2 transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<main class="flex-1 px-container-margin py-lg flex flex-col gap-lg pb-24 max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-outline uppercase">AI Analysis</span>
<span class="font-label-sm text-label-sm text-outline">Step 2 of 6</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5 overflow-hidden">
<div class="bg-primary h-1.5 rounded-full" style="width: 33%"></div>
</div>
</div>
<!-- Title -->
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Analyzing Image...</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Our AI is reviewing the photo to categorize the issue.</p>
</div>
<!-- Image Container with AI Overlay -->
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden shadow-lg bg-surface-gray border border-border-subtle group">
<!-- Target Image -->
<img class="absolute inset-0 w-full h-full object-cover z-0" data-alt="A photo taken from a mobile phone showing a pile of discarded cardboard boxes and black trash bags on a city sidewalk next to a brick building. The lighting is bright daylight, typical of a modern urban street scene. The image style is realistic and documentarian, intended for a civic reporting app. The mood is clear but highlights a minor urban decay issue." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCI0fIw_6u232o-R8q_JY5j4K4N9F-1gl5ti99TJRgJ80Eyz4qyTP8zx9YLtUql7kPt2xxM85G8-6HoBYBkw5oMxVtxGK78EprGUONzmVdSubzOVAoN0X2ns9zHyetAiIIOLgaJGICUO-rLawG8m76sPVwkYpNJFs3hHs2wFs9ubIxlVDUbiSiJ8VEbul8KY0yPNzqnjOoGM4k_KUS1bRvpVojcN-gM9rDuRGWwgSyxbVbk8lUZmxRT"/>
<!-- Scanning Effect -->
<div class="absolute inset-0 z-10 pointer-events-none">
<div class="scanning-line"></div>
<div class="absolute inset-0 bg-primary/10 mix-blend-overlay"></div>
</div>
<!-- Bounding Box (Simulated AI Detection) -->
<div class="absolute top-[30%] left-[20%] w-[50%] h-[40%] border-2 border-primary rounded-md z-20 pulsing-box pointer-events-none">
<!-- Bounding Box Label -->
<div class="absolute -top-6 left-0 bg-primary text-on-primary font-label-sm text-label-sm px-2 py-1 rounded-sm shadow-md whitespace-nowrap flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">auto_awesome</span>
                    Detected Object
                </div>
</div>
<!-- AI Insight Overlay (Bottom of Image) -->
<div class="absolute bottom-4 left-4 right-4 bg-[#E6EFFC]/95 backdrop-blur-md rounded-lg p-md border border-primary/20 shadow-[0px_8px_24px_rgba(9,30,66,0.12)] z-30">
<div class="flex items-start justify-between mb-sm">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider font-semibold">AI Analysis Complete</span>
</div>
<div class="bg-surface rounded-full px-2 py-0.5 border border-primary/10 shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-tertiary">check_circle</span>
<span class="font-label-sm text-label-sm text-tertiary">94% Match</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-xs">Suggested Category</p>
<p class="font-headline-sm text-headline-sm text-on-surface">Cleanliness / Illegal Dumping</p>
</div>
</div>
<!-- Confirmation Actions -->
<div class="mt-auto flex flex-col gap-md pt-lg border-t border-border-subtle">
<p class="font-body-md text-body-md text-center text-on-surface">Is this category correct?</p>
<div class="flex gap-md w-full">
<button class="flex-1 bg-surface border border-primary text-primary font-label-md text-label-md py-3 px-4 rounded-full flex justify-center items-center gap-2 hover:bg-primary/5 transition-colors duration-200 h-[48px]">
<span class="material-symbols-outlined text-[18px]">close</span>
                    No, Edit
                </button>
<button class="flex-1 bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-full flex justify-center items-center gap-2 shadow-md hover:bg-primary/90 transition-colors duration-200 h-[48px]">
<span class="material-symbols-outlined text-[18px]">check</span>
                    Yes, Continue
                </button>
</div>
</div>
</main>
<!-- Navigation omitted as per Shell Visibility rules (Transactional flow step) -->
</body></html>
