<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ChipChap - Report Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#006844",
                        "on-secondary-fixed": "#2f1500",
                        "tertiary-fixed-dim": "#65dca4",
                        "on-error": "#ffffff",
                        "civic-blue-dark": "#0747A6",
                        "inverse-surface": "#1d3054",
                        "outline-variant": "#c3c6d6",
                        "on-error-container": "#93000a",
                        "surface-gray": "#F4F5F7",
                        "primary": "#003d9b",
                        "surface-variant": "#d8e2ff",
                        "surface-container-low": "#f1f3ff",
                        "on-primary-container": "#c4d2ff",
                        "tertiary-fixed": "#82f9be",
                        "on-tertiary": "#ffffff",
                        "on-background": "#051a3e",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-tertiary-container": "#72e9af",
                        "inverse-primary": "#b2c5ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#ccdaff",
                        "alert-red": "#DE350B",
                        "on-surface-variant": "#434654",
                        "surface-container": "#e9edff",
                        "secondary-container": "#fe8a00",
                        "surface-tint": "#0c56d0",
                        "surface-bright": "#faf9ff",
                        "border-subtle": "#DFE1E6",
                        "inverse-on-surface": "#edf0ff",
                        "on-secondary": "#ffffff",
                        "surface": "#faf9ff",
                        "tertiary": "#004e32",
                        "surface-container-highest": "#d8e2ff",
                        "on-surface": "#051a3e",
                        "secondary-fixed-dim": "#ffb77e",
                        "primary-fixed": "#dae2ff",
                        "background": "#faf9ff",
                        "on-primary-fixed-variant": "#0040a2",
                        "secondary-fixed": "#ffdcc3",
                        "error": "#ba1a1a",
                        "safety-orange-light": "#FFFAE6",
                        "on-tertiary-fixed-variant": "#005235",
                        "on-secondary-fixed-variant": "#6e3900",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-high": "#e1e8ff",
                        "primary-container": "#0052cc",
                        "outline": "#737685",
                        "on-primary-fixed": "#001848",
                        "on-secondary-container": "#613100",
                        "secondary": "#914d00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "8px",
                        "xs": "4px",
                        "xl": "32px",
                        "gutter": "12px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
            .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen pb-safe">
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background flex items-center justify-between px-container-margin h-14 transition-colors duration-200">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-colors duration-200 active:scale-95 p-2 flex items-center justify-center -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-civic-blue-dark dark:text-primary-fixed">CHIPCHAP</h1>
<button aria-label="Help" class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-colors duration-200 active:scale-95 p-2 flex items-center justify-center -mr-2">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<!-- Navigation Bottom Shell suppressed due to linear transactional flow (Step 3 of 6) -->
<main class="pt-[72px] px-container-margin pb-[100px] space-y-lg max-w-md mx-auto">
<!-- Progress Indicator -->
<div class="flex flex-col gap-xs pt-sm">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Step 3 of 6</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Header -->
<div class="space-y-xs">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Details</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Verify the location and confirm the AI-suggested category.</p>
</div>
<!-- Location Map Component -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Incident Location</label>
<div class="relative w-full h-[200px] rounded-xl overflow-hidden shadow-[0px_4px_12px_rgba(9,30,66,0.08)] border border-border-subtle bg-surface-container-low group cursor-pointer">
<!-- Map Background -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 ease-in-out group-active:scale-105" data-alt="A clean, minimalist vector-style map of a city neighborhood in a light mode theme. The map features pale gray streets, white city blocks, and subtle soft green parks. It looks like a high-end, modern UI map interface without text labels, conveying a sense of civic clarity and order." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAG-p7z3F2AQ68e6mBOvNsxOGszfJ89WoreAnTKTumm4UO5xHlhimb2JGH3aDXXz3JDuGiDF0u6b0s6LsZlSTTsYNrOcnKSieR4GGv3KpStUtV2B7SMlbmVPp5z5KHs4EmnOIk2Iu0Or7NMGPOx1ewEtgfPSw8FNWv7tZzF0Ew9L-8wvsdK16adYdrowdBtFqbOlWzGV1qC0wWEzscWOLr12r2tp92hxwz9pqwxZzh2t3rI7geKj-eH')"></div>
<!-- Center Pin -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative flex flex-col items-center -mt-6"> <!-- Offset to point at center -->
<span class="material-symbols-outlined text-[40px] text-primary drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="w-4 h-1 bg-black/20 rounded-[100%] absolute bottom-[-4px] blur-[2px]"></div>
</div>
</div>
<!-- Recenter Button -->
<button aria-label="Use current location" class="absolute bottom-md right-md bg-surface text-primary rounded-full p-2.5 shadow-[0px_4px_12px_rgba(9,30,66,0.12)] hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex items-center justify-center border border-border-subtle/50">
<span class="material-symbols-outlined text-[20px]">my_location</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-outline flex items-center gap-xs mt-2">
<span class="material-symbols-outlined text-[16px]">touch_app</span> Pan map to adjust exact pin location
            </p>
</div>
<!-- AI Insight Category Component -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Category</label>
<div class="bg-[#E6EFFC] border border-primary/40 rounded-xl p-md relative overflow-hidden transition-all hover:shadow-[0px_4px_12px_rgba(9,30,66,0.08)]">
<!-- Decorative background elements -->
<div class="absolute -right-4 -top-4 w-16 h-16 bg-primary/5 rounded-full blur-xl pointer-events-none"></div>
<div class="flex items-center justify-between mb-2 relative z-10">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-primary tracking-widest font-bold">AI ANALYSIS</span>
</div>
</div>
<div class="flex justify-between items-center relative z-10 mt-1">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Cleanliness</span>
<button class="text-primary bg-surface/50 px-3 py-1.5 rounded-full hover:bg-surface active:scale-95 transition-all flex items-center gap-1.5 font-label-md text-label-md border border-primary/20 backdrop-blur-sm shadow-sm">
<span class="material-symbols-outlined text-[16px]">edit</span> Edit
                    </button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 max-w-[85%]">
                    Based on your photo, we've categorized this automatically.
                </p>
</div>
</div>
<!-- Severity Input -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface block">Severity Level</label>
<span class="font-label-sm text-label-sm text-outline">Required</span>
</div>
<div class="grid grid-cols-4 gap-2">
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="severity" type="radio" value="low"/>
<div class="py-3 px-1 flex flex-col items-center justify-center text-center bg-surface border border-border-subtle rounded-lg peer-checked:bg-surface-container-high peer-checked:border-primary peer-checked:text-primary text-on-surface-variant font-label-md text-label-md transition-all group-active:scale-95">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim mb-1 peer-checked:bg-primary"></div>
                        Low
                    </div>
</label>
<label class="cursor-pointer relative group">
<input checked="" class="peer sr-only" name="severity" type="radio" value="medium"/>
<div class="py-3 px-1 flex flex-col items-center justify-center text-center bg-surface border border-border-subtle rounded-lg peer-checked:bg-[#fff4e5] peer-checked:border-secondary-container peer-checked:text-secondary-container text-on-surface-variant font-label-md text-label-md transition-all group-active:scale-95 shadow-[0px_4px_12px_rgba(9,30,66,0.04)]">
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim mb-1 peer-checked:bg-secondary-container"></div>
                        Med
                    </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="severity" type="radio" value="high"/>
<div class="py-3 px-1 flex flex-col items-center justify-center text-center bg-surface border border-border-subtle rounded-lg peer-checked:bg-error-container peer-checked:border-error peer-checked:text-error text-on-surface-variant font-label-md text-label-md transition-all group-active:scale-95">
<div class="w-2 h-2 rounded-full bg-error-container mb-1 peer-checked:bg-error"></div>
                        High
                    </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="severity" type="radio" value="critical"/>
<div class="py-3 px-1 flex flex-col items-center justify-center text-center bg-surface border border-border-subtle rounded-lg peer-checked:bg-alert-red peer-checked:border-alert-red peer-checked:text-white text-on-surface-variant font-label-md text-label-md transition-all group-active:scale-95 font-bold">
<span class="material-symbols-outlined text-[16px] mb-0.5" style="font-variation-settings: 'FILL' 1;">warning</span>
                        Crit
                    </div>
</label>
</div>
</div>
<!-- Description Input -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface block" for="desc">Description</label>
<span class="font-label-sm text-label-sm text-outline">Optional</span>
</div>
<div class="relative">
<textarea class="w-full bg-surface border border-border-subtle rounded-xl p-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline-variant resize-none shadow-sm pb-8" id="desc" placeholder="Provide any additional context or details about the issue..." rows="4"></textarea>
<div class="absolute bottom-3 right-3 text-outline-variant font-label-sm text-label-sm pointer-events-none">
                    0 / 300
                </div>
</div>
</div>
</main>
<!-- Floating Action Bar (Transactional Flow specific) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-border-subtle/50 px-container-margin py-md pb-safe flex gap-md z-50 shadow-[0px_-8px_24px_rgba(9,30,66,0.06)]">
<button class="flex-[0.4] min-h-[48px] rounded-full border border-border-subtle bg-surface text-on-surface font-label-md text-label-md font-bold hover:bg-surface-container-low active:scale-95 transition-all flex items-center justify-center shadow-sm">
            Skip
        </button>
<button class="flex-1 min-h-[48px] rounded-full bg-primary text-on-primary font-label-md text-label-md font-bold hover:bg-civic-blue-dark active:scale-95 transition-all flex items-center justify-center gap-2 shadow-[0px_4px_12px_rgba(0,61,155,0.2)]">
            Continue <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</body></html>
