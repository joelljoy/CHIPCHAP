<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            const resendBtn = document.getElementById('resendBtn');
            const timerText = document.getElementById('timerText');
            
            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    
                    // Ensure only 1 character
                    if (value.length > 1) {
                        e.target.value = value.slice(-1);
                    }
                    
                    // Move to next input
                    if (value && index < inputs.length - 1) {
                        inputs[index + 1].disabled = false;
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index].disabled = true;
                    }
                });
                
                // Allow pasting
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/\D/g, '');
                    
                    if (pastedData) {
                        for(let i = 0; i < pastedData.length; i++) {
                            if(i < inputs.length) {
                                inputs[i].disabled = false;
                                inputs[i].value = pastedData[i];
                                if(i < inputs.length -1) {
                                     inputs[i+1].disabled = false;
                                }
                            }
                        }
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                    }
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const updateTimer = () => {
                const seconds = timeLeft.toString().padStart(2, '0');
                timerText.textContent = `00:${seconds}`;
                
                if (timeLeft === 0) {
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend Code';
                } else {
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                }
            };
            
            setTimeout(updateTimer, 1000);
            
            resendBtn.addEventListener('click', () => {
                if(!resendBtn.disabled) {
                    timeLeft = 59;
                    resendBtn.disabled = true;
                    resendBtn.innerHTML = 'Resend in <span id="timerText">00:59</span>';
                    setTimeout(updateTimer, 1000);
                    // In a real app, trigger resend API here
                }
            });
        });
    </script>
