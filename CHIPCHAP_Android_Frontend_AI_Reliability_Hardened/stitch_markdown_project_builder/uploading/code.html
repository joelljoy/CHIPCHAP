<style>
        /* Custom smooth indeterminate spinner animation */
        .spinner-svg {
            animation: rotate 2s linear infinite;
        }
        
        .spinner-circle {
            stroke: currentColor;
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: dash 1.5s ease-in-out infinite;
            stroke-linecap: round;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35px;
            }
            100% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -124px;
            }
        }
        
        /* Subtle background grid pattern to emphasize 'Civic' modern feel without distraction */
        .bg-grid-pattern {
            background-image: radial-gradient(var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
            background-color: var(--tw-colors-background);
            opacity: 0.4;
        }
    </style>
</head>
<!-- 
  NOTE: Navigation Shells (TopAppBar & BottomNavBar) are intentionally SUPPRESSED here.
  Rule: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional..."
  An upload progress screen is a blocking, transactional state.
-->
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-md antialiased flex flex-col">
<!-- Decorative subtle background -->
<div class="absolute inset-0 bg-grid-pattern z-0 pointer-events-none mix-blend-multiply"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center p-container-margin w-full max-w-md mx-auto">
<div class="flex flex-col items-center justify-center w-full max-w-sm space-y-xl">
<!-- Visual Indicator Area -->
<div class="relative w-40 h-40 flex items-center justify-center">
<!-- Outer glow/shadow base -->
<div class="absolute inset-0 bg-surface-variant rounded-full opacity-20 blur-xl animate-pulse"></div>
<!-- Background Track -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="25 25 50 50">
<circle class="text-surface-container-highest" cx="50" cy="50" fill="none" r="20" stroke="currentColor" stroke-width="3"></circle>
</svg>
<!-- Animated Spinner -->
<svg class="absolute inset-0 w-full h-full spinner-svg" viewbox="25 25 50 50">
<circle class="spinner-circle text-primary" cx="50" cy="50" fill="none" r="20" stroke-width="3"></circle>
</svg>
<!-- Center Icon -->
<div class="bg-surface rounded-full p-3 shadow-[0px_4px_12px_rgba(9,30,66,0.08)] z-10">
<span class="material-symbols-outlined text-4xl text-civic-blue-dark" style="font-variation-settings: 'FILL' 1;">
                        cloud_upload
                    </span>
</div>
</div>
<!-- Typography Container -->
<div class="flex flex-col items-center text-center space-y-sm px-4">
<h1 class="font-headline-lg text-headline-lg text-on-surface">
                    Uploading...
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[260px]">
                    Uploading report details and media...
                </p>
</div>
<!-- Safety/Warning Banner (Glassmorphism approach) -->
<div class="mt-lg flex items-center gap-md px-md py-sm rounded-xl bg-surface/80 backdrop-blur-md border border-border-subtle shadow-[0px_8px_24px_rgba(9,30,66,0.04)]">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">
                    info
                </span>
<p class="font-label-md text-label-md text-on-surface-variant">
                    Please do not close the app
                </p>
</div>
</div>
</main>
</body></html>
