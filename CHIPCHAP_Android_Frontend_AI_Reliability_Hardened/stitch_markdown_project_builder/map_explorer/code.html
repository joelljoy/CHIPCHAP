<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Map Area (Canvas) -->
<main class="relative flex-grow h-full w-full">
<!-- The Map Background -->
<div class="absolute inset-0 w-full h-full bg-surface-container-high object-cover z-0" data-location="San Francisco">
<img alt="Map Background" class="w-full h-full object-cover opacity-80" data-alt="A clean, modern, simplified digital street map in a light UI mode, showing urban blocks and parks with subtle depth. The color palette focuses on soft greys, pure whites, and pale blues (Civic Blue) indicating waterways, with gentle pastel greens for park areas. The aesthetic is highly legible, minimal, and professional, suitable for a civic application background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjibroHzQ4-cPixGKy6RjA-j197G7b3CmooLPeTOS-B2De83N9G9jOkeOInLefIrzh2GQSOs_VxuNopaNMPXkRiBNuPIoxslN25VU7GPPF3a2ZhXqyGBCqCNb2rq5tmjkbfJysCi2YaZGPDaQNiVuTAwtkSIWC2An_6P6LGsoQucgTktHKDZVMzmgevqdBuMG835e2meYKj2bx9rFgkEwAw9DBCc3aKICTcQobYAXM-1uaT9952wdV">
</div>
<!-- Top Controls Overlay -->
<div class="absolute top-0 left-0 w-full z-20 pt-safe">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-container-margin h-14 w-full bg-surface/90 backdrop-blur-md shadow-sm transition-colors duration-200">
<button aria-label="Go back" class="text-primary hover:bg-surface-variant/50 rounded-full p-2 transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-civic-blue-dark">CHIPCHAP</h1>
<button aria-label="Help" class="text-primary hover:bg-surface-variant/50 rounded-full p-2 transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Search & Filters -->
<div class="px-container-margin py-md flex flex-col gap-sm mt-2">
<!-- Search Bar -->
<div class="flex items-center bg-surface shadow-[0px_4px_12px_rgba(9,30,66,0.08)] rounded-full px-4 py-2 w-full border border-border-subtle focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-2">search</span>
<input class="bg-transparent border-none outline-none w-full font-body-md text-on-surface placeholder:text-on-surface-variant/70 focus:ring-0 p-0" placeholder="Search complaints or addresses" type="text">
<button class="ml-2 text-primary p-1 bg-surface-variant rounded-full flex items-center justify-center hover:bg-primary hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">tune</span>
</button>
</div>
<!-- Chips -->
<div class="flex overflow-x-auto no-scrollbar gap-2 py-1 items-center pb-2">
<button class="shrink-0 bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-2 rounded-full border border-primary transition-colors">All</button>
<button class="shrink-0 bg-surface text-on-surface font-label-md text-label-md px-4 py-2 rounded-full border border-border-subtle shadow-sm hover:bg-surface-variant transition-colors">Infrastructure</button>
<button class="shrink-0 bg-surface text-on-surface font-label-md text-label-md px-4 py-2 rounded-full border border-border-subtle shadow-sm hover:bg-surface-variant transition-colors">Cleanliness</button>
<button class="shrink-0 bg-surface text-on-surface font-label-md text-label-md px-4 py-2 rounded-full border border-border-subtle shadow-sm hover:bg-surface-variant transition-colors">Safety</button>
</div>
</div>
</div>
<!-- Map Pins (Static examples) -->
<!-- Pin 1: Selected Pothole -->
<button class="absolute top-[40%] left-[30%] z-10 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group focus:outline-none">
<div class="bg-surface text-secondary-container p-2 rounded-full shadow-[0px_8px_24px_rgba(9,30,66,0.12)] border-2 border-primary ring-4 ring-primary/20 scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="w-1 h-3 bg-primary mx-auto mt-[-4px]"></div>
</button>
<!-- Pin 2: Unselected Trash -->
<button class="absolute top-[60%] left-[70%] z-10 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group focus:outline-none hover:scale-105 transition-transform">
<div class="bg-surface text-tertiary p-2 rounded-full shadow-md border border-border-subtle">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">delete</span>
</div>
<div class="w-1 h-3 bg-border-subtle mx-auto mt-[-4px]"></div>
</button>
<!-- Pin 3: Unselected Light -->
<button class="absolute top-[30%] left-[60%] z-10 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group focus:outline-none hover:scale-105 transition-transform">
<div class="bg-surface text-on-surface-variant p-2 rounded-full shadow-md border border-border-subtle">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div class="w-1 h-3 bg-border-subtle mx-auto mt-[-4px]"></div>
</button>
<!-- Floating Action Buttons -->
<div class="absolute right-container-margin bottom-[180px] z-20 flex flex-col gap-md">
<!-- My Location -->
<button aria-label="My Location" class="w-12 h-12 bg-surface rounded-full shadow-[0px_4px_12px_rgba(9,30,66,0.08)] flex items-center justify-center text-primary hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined">my_location</span>
</button>
<!-- Report New -->
<button aria-label="Report New Issue" class="w-14 h-14 bg-primary text-on-primary rounded-full shadow-[0px_8px_24px_rgba(9,30,66,0.12)] flex items-center justify-center hover:bg-civic-blue-dark transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<!-- Selected Item Bottom Sheet Preview -->
<div class="absolute bottom-24 left-0 w-full px-container-margin z-30 transition-transform duration-300 ease-out transform translate-y-0">
<div class="bg-surface rounded-xl shadow-[0px_8px_24px_rgba(9,30,66,0.12)] p-md flex flex-col gap-sm border border-border-subtle/50 relative overflow-hidden">
<!-- Status Chip -->
<div class="flex justify-between items-start mb-1">
<span class="inline-flex items-center gap-1 bg-[#FFF3E0] text-secondary px-2 py-1 rounded font-label-sm text-label-sm uppercase tracking-wider">
<span class="w-2 h-2 rounded-full bg-secondary-container"></span> Pending
                    </span>
<button aria-label="Close Preview" class="text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Severe Pothole</h3>
<div class="flex items-center gap-md text-on-surface-variant font-body-sm">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">directions_walk</span>
<span class="">0.2 miles away</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">group</span>
<span class="">12 Backers</span>
</div>
</div>
<div class="mt-2 flex gap-sm">
<a href="{{DATA:SCREEN:SCREEN_13}}" class="flex-1 bg-primary text-on-primary font-label-md text-label-md h-12 rounded-lg flex items-center justify-center shadow-sm hover:bg-civic-blue-dark transition-colors active:scale-95">View Details</a>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-4 pb-safe bg-surface shadow-[0px_-4px_12px_rgba(9,30,66,0.08)] z-50 rounded-t-xl transition-colors duration-200">
<a aria-label="Home" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-4 py-1 transition-colors duration-200" href="{{DATA:SCREEN:SCREEN_21}}">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a aria-label="Report" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-4 py-1 transition-colors duration-200" href="{{DATA:SCREEN:SCREEN_20}}">
<span class="material-symbols-outlined mb-1">add_circle</span>
<span class="font-label-md text-label-md">Report</span>
</a>
<!-- Active Map Tab -->
<a aria-label="Map" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-110 transition-transform duration-300" href="{{DATA:SCREEN:SCREEN_12}}">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-md text-label-md font-bold">Map</span>
</a>
<a aria-label="Alerts" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-4 py-1 transition-colors duration-200" href="{{DATA:SCREEN:SCREEN_9}}">
<span class="material-symbols-outlined mb-1">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</a>
<a aria-label="Profile" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-4 py-1 transition-colors duration-200" href="{{DATA:SCREEN:SCREEN_6}}">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>


</body></html>
